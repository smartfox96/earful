[project]
name = "earful"
version = "0.0.0"
description = "Deterministic regression tests for real-time voice agents"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = ["jsonschema>=4.18"]

[project.optional-dependencies]
livekit = ["livekit-agents>=1.5.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/earful"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
    "slow: takes over a second, mostly searches that run the framework many times (leave out with -m 'not slow')",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.format]
# Code blocks in the Markdown pages are laid out by hand, with their comments aligned.
exclude = ["*.md"]

[tool.ruff.lint]
# Ruff's default rules, and the line length for what the formatter cannot wrap.
extend-select = ["E501"]

[tool.mypy]
python_version = "3.10"
files = ["src", "scripts", "tests"]
warn_unused_configs = true
warn_unused_ignores = true
warn_redundant_casts = true
# The note mypy prints for an annotation inside a function it does not check.
disable_error_code = ["annotation-unchecked"]

# The package is checked as --strict checks it. Scripts and tests are top-level modules,
# mostly unannotated, and are checked at mypy's defaults. "strict" set in an override
# applies to every module, so the override names each per-module flag it implies.
[[tool.mypy.overrides]]
module = "earful.*"
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
implicit_reexport = false
strict_equality = true
extra_checks = true
# A ledger event is a JSON document checked by its JSON Schema: a field read from one is Any.
warn_return_any = false

[dependency-groups]
lint = ["ruff==0.17.5", "mypy==2.4.1", "types-jsonschema"]
