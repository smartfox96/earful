[project]
name = "earful"
version = "0.3.3"
description = "Deterministic regression tests for real-time voice agents"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
keywords = ["voice agents", "livekit", "pipecat", "testing", "pytest", "deterministic", "regression"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Framework :: AsyncIO",
    "Framework :: Pytest",
    "Topic :: Software Development :: Testing",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Typing :: Typed",
]
dependencies = ["jsonschema>=4.18"]

[project.urls]
Homepage = "https://github.com/smartfox96/earful"
Documentation = "https://github.com/smartfox96/earful/blob/main/docs/testing.md"
Repository = "https://github.com/smartfox96/earful"
Changelog = "https://github.com/smartfox96/earful/blob/main/CHANGELOG.md"
Issues = "https://github.com/smartfox96/earful/issues"

[project.optional-dependencies]
# The releases tested: docs/compatibility.md.
livekit = ["livekit-agents>=1.5.6,<1.10"]
# pipecat-ai needs Python 3.11: on 3.10 the extra installs nothing.
pipecat = ["pipecat-ai>=1.16,<1.18; python_version >= '3.11'"]

[project.scripts]
earful = "earful.cli:main"

[project.entry-points.pytest11]
earful = "earful.pytest_plugin"

[build-system]
# The newest release every pinned environment can install: the oldest is resolved as of
# 2026-04-30, and an editable install builds Earful with it too.
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/earful"]

# Everything the tests read, so that they run from an unpacked source distribution.
[tool.hatch.build.targets.sdist]
include = [
    "src",
    "tests",
    "docs",
    "examples",
    "skills",
    "scripts",
    "compat",
    "releases.toml",
    ".github",
    ".pre-commit-config.yaml",
    "*.md",
    "LICENSE",
    "NOTICE",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "--strict-markers"
# An expected failure that passes fails the run, until its marker is removed.
xfail_strict = true
markers = [
    "slow: takes over a second, mostly searches that run the framework many times (leave out with -m 'not slow')",
    "walkthrough: a slow test that runs the examples of a documentation page from end to end",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.format]
# Code blocks in the Markdown pages are laid out by hand, with their comments aligned.
exclude = ["*.md"]

[tool.ruff.lint]
extend-select = ["E501"]

[tool.mypy]
python_version = "3.10"
files = ["src", "scripts", "tests"]
warn_unused_configs = true
warn_unused_ignores = true
warn_redundant_casts = true
# The note mypy prints for an annotation inside a function it does not check.
disable_error_code = ["annotation-unchecked"]

# The package is checked as --strict does. "strict" in an override would apply to every
# module, so the override names each flag it implies.
[[tool.mypy.overrides]]
module = "earful.*"
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
implicit_reexport = false
strict_equality = true
extra_checks = true
# A ledger event is a JSON document checked by its JSON Schema: a field read from one is Any.
warn_return_any = false

[dependency-groups]
# What the tests need beside a framework. The environment scripts install it.
test = ["pytest", "pytest-asyncio", "pytest-xdist", "hypothesis"]
lint = ["ruff==0.17.5", "mypy==2.4.1", "types-jsonschema"]
