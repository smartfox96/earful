[project]
name = "earful"
version = "0.0.0"
description = "Deterministic regression tests for real-time voice agents"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = ["jsonschema>=4.18"]

[project.optional-dependencies]
livekit = ["livekit-agents>=1.5.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/earful"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.format]
# Code blocks in the Markdown pages are laid out by hand, with their comments aligned.
exclude = ["*.md"]

[tool.ruff.lint]
# Ruff's default rules, and the line length for what the formatter cannot wrap.
extend-select = ["E501"]

[dependency-groups]
lint = ["ruff==0.17.5", "mypy==2.4.1", "types-jsonschema"]
