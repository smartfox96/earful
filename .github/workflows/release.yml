name: release

# A tag v<version> builds, checks and publishes to PyPI through a trusted publisher:
# no token is stored here. See CONTRIBUTING.md, "Releasing".
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

# Named, so that every step runs with pipefail: a failure before a pipe fails the step.
defaults:
  run:
    shell: bash

env:
  UV_VERSION: "0.13.9"

jobs:
  build:
    name: build and check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # the next step asks whether main contains the tag's commit
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: ${{ env.UV_VERSION }}
      - name: The tag is on main
        run: |
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "$GITHUB_REF_NAME is on $(git rev-parse HEAD), which is not a commit of main" >&2
            exit 1
          fi
      - name: The tag names the version in pyproject.toml
        run: |
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml)"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "the tag is $GITHUB_REF_NAME and pyproject.toml says $version" >&2
            exit 1
          fi
      - name: The wheel installs clean (scripts/wheel_smoke.sh)
        run: scripts/wheel_smoke.sh
      - name: The README's quickstart works from the wheel (scripts/quickstart_check.sh)
        run: scripts/quickstart_check.sh
      - name: Build the wheel and the source distribution
        run: uv build --out-dir dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist/earful-*

  publish:
    name: publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      id-token: write # the trusted publisher's proof of which workflow this is
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
