name: ci

# A pull request is checked once, as the merge of the branch into its base. A push is
# checked only on main, and only if those exact files have not already passed as a pull
# request (scripts/ci_tested.sh). Closing or merging a pull request starts a run that
# does nothing except replace the one in progress for it.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]
  schedule:
    - cron: "17 4 * * *" # nightly: catches dependency drift under the pinned releases
  workflow_dispatch:

# A new run replaces the one in progress for the same pull request, and for main: the
# newer commit on main contains the older one.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: what changed
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read # scripts/ci_tested.sh asks which pull request a commit came from
      actions: read # and whether ci passed on it
    outputs:
      code: ${{ steps.scope.outputs.code }}
      docs: ${{ steps.scope.outputs.docs }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Decide from the changed paths (scripts/ci_scope.sh)
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$EVENT" in
            pull_request) scripts/ci_scope.sh HEAD^1 HEAD ;; # HEAD is the merge into the base
            push)
              if [ "$(scripts/ci_tested.sh "$GITHUB_SHA")" = "tested=true" ]; then
                echo "These files passed ci as a pull request: nothing to run again." >&2
                printf 'code=false\ndocs=false\n'
              else
                scripts/ci_scope.sh "$BEFORE" HEAD
              fi ;;
            *) printf 'code=true\ndocs=true\n' ;; # nightly and manual runs check everything
          esac | tee -a "$GITHUB_OUTPUT"

  # A change to the pages alone: the one test file that reads them, on the latest release.
  docs:
    name: docs match the code
    needs: changes
    if: needs.changes.outputs.code != 'true' && needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Build pinned environment
        run: scripts/make_env.sh 1.8.12 2026-11-14
      - name: Tests that read docs/
        run: .venvs/lk-1.8.12/bin/python -m pytest -q tests/test_docs.py

  lint:
    name: format, lint, types
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: ruff format, ruff check, mypy, mutants apply (scripts/lint.sh)
        run: scripts/lint.sh

  determinism:
    name: lk ${{ matrix.lk.version }} / ${{ matrix.os }} / py${{ matrix.python }}
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.13"]
        lk:
          - { version: "1.5.6", as_of: "2026-04-30" }
          - { version: "1.5.7", as_of: "2026-05-06" }
          - { version: "1.6.5", as_of: "2026-07-20" }
          - { version: "1.6.6", as_of: "2026-07-20" }
          - { version: "1.8.12", as_of: "2026-11-14" }
        # macOS runs the oldest and the newest release on a pull request and on a push.
        # The nightly and manual runs add the three between: there the name below is one
        # no job has, so nothing is left out.
        exclude:
          - os: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'every release' || 'macos-latest' }}
            lk: { version: "1.5.7", as_of: "2026-05-06" }
          - os: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'every release' || 'macos-latest' }}
            lk: { version: "1.6.5", as_of: "2026-07-20" }
          - os: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'every release' || 'macos-latest' }}
            lk: { version: "1.6.6", as_of: "2026-07-20" }
        # Every other supported Python, once each, spread across releases.
        include:
          - os: ubuntu-latest
            python: "3.10"
            lk: { version: "1.6.6", as_of: "2026-07-20" }
          - os: ubuntu-latest
            python: "3.11"
            lk: { version: "1.5.6", as_of: "2026-04-30" }
          - os: ubuntu-latest
            python: "3.12"
            lk: { version: "1.8.12", as_of: "2026-11-14" }
          - os: ubuntu-latest
            python: "3.14"
            lk: { version: "1.8.12", as_of: "2026-11-14" }
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Build pinned environment
        run: EARFUL_PYTHON=${{ matrix.python }} scripts/make_env.sh ${{ matrix.lk.version }} ${{ matrix.lk.as_of }}
      - name: Tests
        run: .venvs/lk-${{ matrix.lk.version }}/bin/python -m pytest -q
      - name: Repeatability (every case, 100 in-process + 20 subprocess) and committed-hash check
        run: >-
          .venvs/lk-${{ matrix.lk.version }}/bin/python scripts/repeat.py
          --check tests/golden --out evidence
      - name: Historical cases (#3702, #5509)
        run: |
          .venvs/lk-${{ matrix.lk.version }}/bin/python scripts/spike_3702.py evidence
          .venvs/lk-${{ matrix.lk.version }}/bin/python scripts/spike_5509.py evidence
      - name: Reduced historical cases, replayed
        run: |
          for kept in tests/bundles/*/; do
            .venvs/lk-${{ matrix.lk.version }}/bin/python scripts/replay.py "$kept"
          done
      - name: Negative control (real clock must change the hash)
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.13' && matrix.lk.version == '1.8.12'
        run: .venvs/lk-${{ matrix.lk.version }}/bin/python scripts/realtime_control.py 2
      - uses: actions/upload-artifact@v4
        with:
          name: evidence-${{ matrix.lk.version }}-${{ matrix.os }}-py${{ matrix.python }}
          path: evidence/

  # One result for the whole run, whichever jobs the change needed. This is the check to
  # require on main: a skipped job passes, a failed or cancelled one does not.
  result:
    name: ci result
    needs: [changes, docs, lint, determinism]
    if: always() && github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job that ran has passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "changes, docs, lint, determinism: $RESULTS"
          case " $RESULTS " in
            *" failure "* | *" cancelled "*) exit 1 ;;
          esac
