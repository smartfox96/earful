name: ci

on:
  push:
  pull_request:
  schedule:
    - cron: "17 4 * * *" # nightly: catches dependency drift under the pinned releases

jobs:
  determinism:
    name: lk ${{ matrix.lk.version }} / ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.13"]
        lk:
          - { version: "1.5.6", as_of: "2026-04-30" }
          - { version: "1.5.7", as_of: "2026-05-06" }
          - { version: "1.6.5", as_of: "2026-07-20" }
          - { version: "1.6.6", as_of: "2026-07-20" }
          - { version: "1.8.12", as_of: "2026-11-14" }
        # Every other supported Python, once each, spread across releases.
        include:
          - os: ubuntu-latest
            python: "3.10"
            lk: { version: "1.6.6", as_of: "2026-07-20" }
          - os: ubuntu-latest
            python: "3.11"
            lk: { version: "1.5.6", as_of: "2026-04-30" }
          - os: ubuntu-latest
            python: "3.12"
            lk: { version: "1.8.12", as_of: "2026-11-14" }
          - os: ubuntu-latest
            python: "3.14"
            lk: { version: "1.8.12", as_of: "2026-11-14" }
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Build pinned environment
        run: EARFUL_PYTHON=${{ matrix.python }} scripts/make_env.sh ${{ matrix.lk.version }} ${{ matrix.lk.as_of }}
      - name: Tests
        run: .venvs/lk-${{ matrix.lk.version }}/bin/python -m pytest -q
      - name: Repeatability (every case, 100 in-process + 20 subprocess) and committed-hash check
        run: >-
          .venvs/lk-${{ matrix.lk.version }}/bin/python scripts/repeat.py
          --check tests/golden --out evidence
      - name: Historical cases (#3702, #5509)
        run: |
          .venvs/lk-${{ matrix.lk.version }}/bin/python scripts/spike_3702.py evidence
          .venvs/lk-${{ matrix.lk.version }}/bin/python scripts/spike_5509.py evidence
      - name: Negative control (real clock must change the hash)
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.13' && matrix.lk.version == '1.8.12'
        run: .venvs/lk-${{ matrix.lk.version }}/bin/python scripts/realtime_control.py 2
      - uses: actions/upload-artifact@v4
        with:
          name: evidence-${{ matrix.lk.version }}-${{ matrix.os }}-py${{ matrix.python }}
          path: evidence/
