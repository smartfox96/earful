name: ci

# The jobs are in checks.yml. Its last job, "ci / result", is the check main requires.
# A pull request runs what its paths select, and everything with the label "full ci".
# Each night, and on request, everything runs on main.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, edited, labeled, closed]
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

# The runs of a pull request share a group: a push, a new base, the label "full ci" or
# closing it cancels the run in progress. An edit of its text, another label and every run
# on main have a group of their own and cancel nothing.
concurrency:
  group: >-
    ci-${{ github.event_name == 'pull_request'
    && !(github.event.action == 'edited' && !github.event.changes.base)
    && !(github.event.action == 'labeled' && github.event.label.name != 'full ci')
    && format('pull-request-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

# Named, so that every step runs with pipefail: a failure before a pipe fails the step.
defaults:
  run:
    shell: bash

jobs:
  # Skipped, it leaves one check named "ci" and none named "ci / result".
  ci:
    name: ci
    if: >-
      github.event.action != 'closed'
      && (github.event.action != 'edited' || github.event.changes.base)
      && (github.event.action != 'labeled' || github.event.label.name == 'full ci')
    uses: ./.github/workflows/checks.yml
    with:
      tier: >-
        ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        || contains(github.event.pull_request.labels.*.name, 'full ci'))
        && 'full' || 'pull-request' }}
    permissions:
      contents: read
      pull-requests: read # the scope asks which pull request a commit on main came from
      actions: read # and whether ci passed on it

  nightly:
    name: a failed night opens an issue
    needs: ci
    if: always() && github.event_name == 'schedule' && needs.ci.result != 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open an issue that names the run, or add the run to the one open
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="The nightly run of ci failed"
          open="$(gh issue list --state open --search "\"$title\" in:title" \
            --json number --jq '.[0].number // empty')"
          body="$RUN names the jobs that failed. A pull request runs the jobs its paths select,
          so main can hold a change that fails a job it left out. A release runs every job,
          so none can be made until this passes."
          if [ -n "$open" ]; then
            gh issue comment "$open" --body "Failed again: $RUN"
          else
            gh issue create --title "$title" --body "$body"
          fi
