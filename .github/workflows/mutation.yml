name: mutation

# Every deliberate break in tests/mutants.py, applied in turn: each must fail a test it
# names. It runs each night and on request, in four parts side by side. Each part also
# runs the unbroken suite as its control, and that is what a part waits for. The lint job
# of ci.yml checks on every change that each break still applies to the code and that the
# tests it names exist.
on:
  schedule:
    - cron: "47 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mutants:
    name: mutants ${{ matrix.part }}/4
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Build pinned environment
        run: scripts/make_env.sh 1.8.12 2026-11-14
      - name: Break the code one place at a time (scripts/mutate.py)
        run: >-
          .venvs/lk-1.8.12/bin/python scripts/mutate.py
          --shard ${{ matrix.part }}/4 --json mutation-${{ matrix.part }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutation-${{ matrix.part }}
          path: mutation-${{ matrix.part }}.json
