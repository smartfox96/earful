name: mutation

# Every deliberate break in tests/mutants.py must fail a test it names (scripts/mutate.py).
# In four parts: nightly, on request, and from ci.yml for a pull request that changes
# src/ or tests/ (scripts/ci_scope.sh).
on:
  schedule:
    - cron: "47 4 * * *"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

# Named, so that every step runs with pipefail: a failure before a pipe fails the step.
defaults:
  run:
    shell: bash

env:
  UV_VERSION: "0.13.9"

jobs:
  mutants:
    name: mutants ${{ matrix.part }}/4
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
      - name: Build the environment with both frameworks (scripts/make_lint_env.sh)
        run: scripts/make_lint_env.sh
      - name: Break the code one place at a time (scripts/mutate.py)
        run: >-
          .venvs/lint/bin/python scripts/mutate.py
          --shard ${{ matrix.part }}/4 --json mutation-${{ matrix.part }}.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: mutation-${{ matrix.part }}
          path: mutation-${{ matrix.part }}.json
